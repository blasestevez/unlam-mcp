[project]
name = "unlam-mcp"
version = "0.1.1"
description = "Servidor MCP para la UNLaM: MIeL e Intraconsulta desde cualquier asistente con MCP (Claude, Cursor, VS Code, Codex, Gemini CLI...)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Blas", email = "126523540+blasestevez@users.noreply.github.com" }
]
requires-python = ">=3.12"
keywords = ["mcp", "mcp-server", "model-context-protocol", "unlam", "miel", "intraconsulta", "universidad", "argentina"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.28",
    "keyring>=25.7.0",
    "mcp>=2.3,<3",
    "pillow>=13.0.0",
    "pydantic-settings>=2.6",
    "pypdfium2>=5.15.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

[project.urls]
Homepage = "https://unlam-mcp.vercel.app"
Documentation = "https://unlam-mcp.vercel.app/#instalar"
Repository = "https://github.com/blasestevez/unlam-mcp"
Issues = "https://github.com/blasestevez/unlam-mcp/issues"

[project.scripts]
unlam-mcp = "unlam_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
